name: Build-and-test

on: [push, pull_request]

jobs:
  test:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run tests
        run: xcodebuild test -project MTMR.xcodeproj -scheme 'UnitTests' | xcpretty -c && exit ${PIPESTATUS[0]}

  build:
    runs-on: macOS-latest

    steps:
      - uses: actions/checkout@v3

      - name: Build (Apple Silicon binary)
        run: xcodebuild archive -project "MTMR.xcodeproj" -scheme "MTMR" -archivePath Release/App.xcarchive DEVELOPMENT_TEAM="" CODE_SIGN_IDENTITY="" ARCHS="arm64" | xcpretty -c && exit ${PIPESTATUS[0]}

      - name: Verify Apple Silicon binary
        run: test "$(lipo -archs Release/App.xcarchive/Products/Applications/MTMR.app/Contents/MacOS/MTMR)" = arm64
